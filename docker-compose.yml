services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:-admin@specfortest.ru}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "127.0.0.1:${TRAEFIK_HTTP_PORT:-8088}:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/letsencrypt

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
    volumes:
      - backend-data:/app/data
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3001"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
      - traefik
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-backend:3001}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    labels:
      - traefik.enable=true
      - traefik.http.routers.magnit-http.rule=Host(`${DOMAIN:-magnit.specfortest.ru}`)
      - traefik.http.routers.magnit-http.entrypoints=web
      - traefik.http.routers.magnit-http.middlewares=magnit-https
      - traefik.http.middlewares.magnit-https.redirectscheme.scheme=https
      - traefik.http.routers.magnit.rule=Host(`${DOMAIN:-magnit.specfortest.ru}`)
      - traefik.http.routers.magnit.entrypoints=websecure
      - traefik.http.routers.magnit.tls=true
      - traefik.http.routers.magnit.tls.certresolver=letsencrypt
      - traefik.http.services.magnit.loadbalancer.server.port=80

  admin:
    build:
      context: ./admin
    restart: unless-stopped
    depends_on:
      - traefik
    ports:
      - "127.0.0.1:${ADMIN_PORT:-18081}:80"
    labels:
      - traefik.enable=true
      - traefik.http.routers.magnit-admin.rule=Host(`${DOMAIN:-magnit.specfortest.ru}`) && PathPrefix(`/admin`)
      - traefik.http.routers.magnit-admin.priority=100
      - traefik.http.routers.magnit-admin.entrypoints=websecure
      - traefik.http.routers.magnit-admin.tls=true
      - traefik.http.routers.magnit-admin.tls.certresolver=letsencrypt
      - traefik.http.services.magnit-admin.loadbalancer.server.port=80

volumes:
  backend-data:
  traefik-certificates:
