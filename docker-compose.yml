services:
  kafka:
    image: apache/kafka:4.1.1
    restart: unless-stopped
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 134217728
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1024m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:-admin@specfortest.ru}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "127.0.0.1:${TRAEFIK_HTTP_PORT:-8088}:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/letsencrypt

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      KAFKA_BROKERS: kafka:19092
      KAFKA_TRANSLATION_TOPIC: magnit.translation.requests.v1
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-8}
      TRANSLATION_WORKER_CONCURRENCY: ${TRANSLATION_WORKER_CONCURRENCY:-8}
      TRANSLATION_MAX_ATTEMPTS: ${TRANSLATION_MAX_ATTEMPTS:-5}
      ENABLE_TEST_PANEL: ${ENABLE_TEST_PANEL:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-434092620,612078835,741068321}
    volumes:
      - backend-data:/app/data
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3001"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
      - traefik
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-backend:3001}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    labels:
      - traefik.enable=true
      - traefik.http.routers.magnit-http.rule=Host(`${DOMAIN:-magnit.specfortest.ru}`)
      - traefik.http.routers.magnit-http.entrypoints=web
      - traefik.http.routers.magnit-http.middlewares=magnit-https
      - traefik.http.middlewares.magnit-https.redirectscheme.scheme=https
      - traefik.http.routers.magnit.rule=Host(`${DOMAIN:-magnit.specfortest.ru}`)
      - traefik.http.routers.magnit.entrypoints=websecure
      - traefik.http.routers.magnit.tls=true
      - traefik.http.routers.magnit.tls.certresolver=letsencrypt
      - traefik.http.services.magnit.loadbalancer.server.port=80

  admin:
    build:
      context: ./admin
    restart: unless-stopped
    depends_on:
      - traefik
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-backend:3001}
    ports:
      - "127.0.0.1:${ADMIN_PORT:-18081}:80"
    labels:
      - traefik.enable=true
      - traefik.http.routers.magnit-admin-http.rule=Host(`${ADMIN_DOMAIN:-magnit.specfortest.ru}`)
      - traefik.http.routers.magnit-admin-http.entrypoints=web
      - traefik.http.routers.magnit-admin-http.middlewares=magnit-admin-https
      - traefik.http.middlewares.magnit-admin-https.redirectscheme.scheme=https
      - traefik.http.routers.magnit-admin.rule=Host(`${ADMIN_DOMAIN:-magnit.specfortest.ru}`)
      - traefik.http.routers.magnit-admin.priority=100
      - traefik.http.routers.magnit-admin.entrypoints=websecure
      - traefik.http.routers.magnit-admin.tls=true
      - traefik.http.routers.magnit-admin.tls.certresolver=letsencrypt
      - traefik.http.services.magnit-admin.loadbalancer.server.port=80

volumes:
  backend-data:
  kafka-data:
  traefik-certificates:
