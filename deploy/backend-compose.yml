services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-https://magnit.specfortest.ru}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
    volumes:
      - backend-data:/app/data
    ports:
      - "3001:3001"

volumes:
  backend-data:
